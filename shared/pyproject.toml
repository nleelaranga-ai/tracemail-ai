[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemail-shared"
version = "1.0.0"
description = "TraceMail AI shared contracts, enums, validation, and configuration"
readme = "README.md"
authors = [{ name = "Threat Intelligence & Integration Team" }]
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
