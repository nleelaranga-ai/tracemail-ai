[pytest]
testpaths = member6/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    pdf: tests that require WeasyPrint installed (slow, skip in CI without system libs)
    api: API-level tests
    smoke: smoke tests that should always pass
    unit: unit tests
    integration: integration tests
    contract: contract/schema tests
    e2e: end-to-end tests

# Output
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s

# Coverage
addopts =
    --strict-markers
    --tb=short
    -q
