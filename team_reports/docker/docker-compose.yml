# ============================================================
# TraceMail AI — SIH26106
# File: team_reports/docker/docker-compose.yml
#
# Complete stack orchestration.
# Start everything with ONE command:
#   docker compose -f team_reports/docker/docker-compose.yml up --build
#
# Services:
#   postgres   → Port 5432  (PostgreSQL database)
#   redis      → Port 6379  (Task queue / caching)
#   backend    → Port 8000  (FastAPI + Reports Engine)
#   frontend   → Port 3000  (Next.js UI)
#
# AI/Intelligence engines (stubs for integration):
#   ai-engine  → Port 8001  (Phishing Detection AI)
#   threat-intel → Port 8002 (Threat Intelligence)
#   maps-engine  → Port 8003 (GeoLocation Maps)
#
# ============================================================

version: "3.9"

networks:
  tracemail-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tracemail-postgres
    restart: unless-stopped
    networks:
      - tracemail-net
    environment:
      POSTGRES_DB: tracemail
      POSTGRES_USER: tracemail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemail_dev_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemail -d tracemail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tracemail-redis
    restart: unless-stopped
    networks:
      - tracemail-net
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Reports Engine) ──────────────────────
  backend:
    build:
      context: ../..
      dockerfile: team_reports/docker/Dockerfile.backend
    container_name: tracemail-backend
    restart: unless-stopped
    networks:
      - tracemail-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracemail:${POSTGRES_PASSWORD:-tracemail_dev_secret}@postgres:5432/tracemail
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Service URLs for internal communication
      AI_ENGINE_URL: http://ai-engine:8001
      THREAT_INTEL_URL: http://threat-intel:8002
      MAPS_ENGINE_URL: http://maps-engine:8003
      # Reports Engine is embedded in backend
      REPORTS_ENGINE_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ──────────────────────────────────────
  frontend:
    profiles: ["frontend", "full"]
    build:
      context: ../..
      dockerfile: team_reports/docker/Dockerfile.frontend
    container_name: tracemail-frontend
    restart: unless-stopped
    networks:
      - tracemail-net
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: "TraceMail AI"
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── AI Engine Stub (Member 2) ───────────────────────────────
  # Replace with actual AI engine image when available
  ai-engine:
    image: python:3.12-slim
    container_name: tracemail-ai-engine
    restart: unless-stopped
    networks:
      - tracemail-net
    command: >
      python -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json
      class H(BaseHTTPRequestHandler):
        def do_GET(self):
          self.send_response(200)
          self.send_header('Content-Type','application/json')
          self.end_headers()
          self.wfile.write(json.dumps({'status':'ok','service':'ai-engine'}).encode())
        def log_message(self, *args): pass
      HTTPServer(('0.0.0.0', 8001), H).serve_forever()
      "
    ports:
      - "8001:8001"

  # ── Threat Intelligence Stub (Member 3) ─────────────────────
  threat-intel:
    image: python:3.12-slim
    container_name: tracemail-threat-intel
    restart: unless-stopped
    networks:
      - tracemail-net
    command: >
      python -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json
      class H(BaseHTTPRequestHandler):
        def do_GET(self):
          self.send_response(200)
          self.send_header('Content-Type','application/json')
          self.end_headers()
          self.wfile.write(json.dumps({'status':'ok','service':'threat-intel'}).encode())
        def log_message(self, *args): pass
      HTTPServer(('0.0.0.0', 8002), H).serve_forever()
      "
    ports:
      - "8002:8002"

  # ── Maps Engine Stub (Member 4) ─────────────────────────────
  maps-engine:
    image: python:3.12-slim
    container_name: tracemail-maps-engine
    restart: unless-stopped
    networks:
      - tracemail-net
    command: >
      python -c "
      from http.server import HTTPServer, BaseHTTPRequestHandler
      import json
      class H(BaseHTTPRequestHandler):
        def do_GET(self):
          self.send_response(200)
          self.send_header('Content-Type','application/json')
          self.end_headers()
          self.wfile.write(json.dumps({'status':'ok','service':'maps-engine'}).encode())
        def log_message(self, *args): pass
      HTTPServer(('0.0.0.0', 8003), H).serve_forever()
      "
    ports:
      - "8003:8003"
